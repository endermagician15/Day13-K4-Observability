service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: P95 response latency must stay at or below 3000 ms for 99.5% of the 28-day window.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: Request failures must stay at or below 2% for 99% of the 28-day window.
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Daily model spend must stay at or below the 2.50 USD budget cap.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: The response quality proxy must remain at or above 0.75 for 95% of the window.

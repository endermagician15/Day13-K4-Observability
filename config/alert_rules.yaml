alerts:
  - name: HighLatencyP95
    severity: critical
    condition: latency_p95 > 3000ms for 5m
    type: symptom-based
    owner: oncall-backend
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2% for 5m
    type: symptom-based
    owner: oncall-backend
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: quality_avg < 0.75 for 10m
    type: symptom-based
    owner: oncall-ai
    runbook: docs/alerts.md#alert-3
